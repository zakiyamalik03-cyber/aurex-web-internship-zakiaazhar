<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Task Manager built with HTML, CSS and vanilla JavaScript (Week 3).">
  <title>Task Manager | Zakia Azhar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Task Manager</h1>
    <p>Add, complete and delete your tasks</p>
  </header>

  <main>

    <section id="add-task">
      <h2>Add a Task</h2>
      <form id="task-form">
        <label for="task-input">New task</label>
        <div class="form-row">
          <input type="text" id="task-input" placeholder="e.g. Practice JavaScript loops" autocomplete="off">
          <button type="submit">Add Task</button>
        </div>
      </form>
      <p id="message" role="alert"></p>
    </section>

    <section id="my-tasks">
      <h2>My Tasks</h2>
      <p id="counter"></p>
      <ul id="task-list"></ul>
      <p id="empty-message">No tasks yet. Add your first task above.</p>
    </section>

  </main>

  <footer>
    <p>&copy; 2026 Zakia Azhar. AUREX Web Internship, Week 3.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
